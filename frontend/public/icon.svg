<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B5CFF"/>
      <stop offset="0.55" stop-color="#4B23C8"/>
      <stop offset="1" stop-color="#1A0B4A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E9E1FF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#B9A4FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#B9A4FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="262" r="190" fill="url(#glow)"/>

  <!-- círculo do sinal -->
  <circle cx="256" cy="262" r="168" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"/>
  <circle cx="256" cy="262" r="148" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2" stroke-dasharray="6 14"/>

  <!-- glifo (brilho + traço) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#D9CCFF" stroke-width="30" opacity="0.7" filter="url(#soft)">
      <path d="M166 356 L256 140 L346 356"/>
      <path d="M150 262 Q256 226 362 262"/>
      <path d="M214 316 L256 362 L298 316"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="22">
      <path d="M166 356 L256 140 L346 356"/>
      <path d="M150 262 Q256 226 362 262"/>
      <path d="M214 316 L256 362 L298 316"/>
    </g>
    <circle cx="256" cy="100" r="9" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>
