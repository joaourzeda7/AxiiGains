<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".5" r=".75">
      <stop offset="0" stop-color="#3a1d8f"/>
      <stop offset="1" stop-color="#0b0616"/>
    </radialGradient>
    <radialGradient id="iris" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f1ebff"/>
      <stop offset=".35" stop-color="#b9a4ff"/>
      <stop offset=".75" stop-color="#6a45f5"/>
      <stop offset="1" stop-color="#22105a"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  
  <!-- brilho em volta do olho -->
  <path d="M56 256 Q256 70 456 256 Q256 442 56 256 Z" fill="#9c85ff" opacity=".45" filter="url(#blur)"/>
  <path d="M56 256 Q256 70 456 256 Q256 442 56 256 Z" fill="#120a26"/>
  <!-- íris com fibras (o tracejado num traço grosso vira raios) -->
  <circle cx="256" cy="256" r="112" fill="url(#iris)"/>
  <circle cx="256" cy="256" r="74" fill="none" stroke="#2a1466" stroke-opacity=".45" stroke-width="64" stroke-dasharray="1.5 5"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#1b0b4a" stroke-width="8"/>
  <!-- pupila em fenda, como os olhos dos bruxos -->
  <ellipse cx="256" cy="256" rx="17" ry="96" fill="#07030f"/>
  <ellipse cx="228" cy="214" rx="14" ry="9" fill="#ffffff" opacity=".85"/>
  <path d="M56 256 Q256 70 456 256 Q256 442 56 256 Z" fill="none" stroke="#ffffff" stroke-width="16" stroke-linejoin="round"/>
</svg>
